<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tshabalala Raycee — Portfolio</title>
<link rel="icon" href="ROASOD.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#03060d;
    --accent:#19a7ff;
    --accent-bright:#7fe0ff;
    --accent-deep:#06325c;
    --text:#eef6ff;
    --muted:rgba(196,220,245,0.7);
    --glass:rgba(10,22,46,0.45);
    --line:rgba(120,190,255,0.22);
}
*{box-sizing:border-box;}
*::-webkit-scrollbar{display:none;}
*{-ms-overflow-style:none; scrollbar-width:none;}

body,html{
    margin:0;
    height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
    font-family:'Inter',sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
}

/* nebula glow background, matching the brand mark */
.bg{
    position:fixed;
    inset:0;
    z-index:0;
    background:
        radial-gradient(900px 650px at 50% 38%, rgba(25,167,255,0.22), transparent 60%),
        radial-gradient(700px 500px at 50% 100%, rgba(10,40,90,0.3), transparent 70%),
        var(--bg);
}
.stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
        radial-gradient(circle at 1px 1px, rgba(255,255,255,0.55) 1px, transparent 1.6px);
    background-size:30px 30px;
    opacity:0.35;
}
.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:0.8;
    mix-blend-mode:screen;
    will-change:transform;
    animation:float 26s ease-in-out infinite;
}
.b1{ width:520px; height:520px; left:-12%; top:8%;
    background:linear-gradient(135deg, rgba(25,167,255,0.35), transparent); }
.b2{ width:420px; height:420px; right:-10%; top:32%; animation-delay:3s;
    background:linear-gradient(120deg, rgba(127,224,255,0.22), transparent); animation-duration:22s;}
.b3{ width:360px; height:360px; left:18%; bottom:-12%; animation-delay:5s;
    background:linear-gradient(90deg, rgba(25,167,255,0.18), transparent); animation-duration:32s;}
@keyframes float{
    0%{transform:translateY(0) translateX(0) scale(1);}
    50%{transform:translateY(-30px) translateX(20px) scale(1.04);}
    100%{transform:translateY(0) translateX(0) scale(1);}
}

/* brand mark with rotating halo signature */
.brand{
    position:relative;
    width:96px; height:96px;
    display:flex; align-items:center; justify-content:center;
}
.brand::before{
    content:'';
    position:absolute;
    inset:-12px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent-bright), var(--accent), transparent 60%, var(--accent));
    filter:blur(12px);
    opacity:0.75;
    animation:spinHalo 9s linear infinite;
}
@keyframes spinHalo{ to{ transform:rotate(360deg); } }
.brand img{
    position:relative;
    z-index:1;
    width:90px; height:90px;
    border-radius:50%;
    object-fit:cover;
    box-shadow:0 0 0 2px rgba(255,255,255,0.08), 0 0 25px rgba(25,167,255,0.5);
    background:#03060d;
}

h1{
    margin:0;
    font-size:clamp(40px,7vw,72px);
    letter-spacing:0.4px;
    font-weight:800;
    font-family:'Inter',sans-serif;
    color:var(--text);
    text-transform:uppercase;
}
h2{
    margin:0;
    font-size:clamp(14px,2.1vw,18px);
    font-weight:600;
    color:var(--muted);
}
h3{
    margin:0;
    font-family:'Dancing Script',cursive;
    letter-spacing:1px;
    font-weight:600;
    font-size:22px;
    color:var(--muted);
}

.cta{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-top:20px;
    padding:13px 30px;
    border-radius:30px;
    background:linear-gradient(135deg, var(--accent), var(--accent-bright));
    color:#031321;
    text-decoration:none;
    font-weight:700;
    letter-spacing:0.6px;
    box-shadow:0 0 18px rgba(25,167,255,0.45), 0 8px 20px rgba(0,0,0,0.45);
    transition:transform .3s ease, box-shadow .3s ease;
    animation:pulse 2.6s infinite ease-in-out;
}
@keyframes pulse{
    0%{ box-shadow:0 0 14px rgba(25,167,255,0.4), 0 8px 20px rgba(0,0,0,0.4); }
    50%{ box-shadow:0 0 26px rgba(127,224,255,0.6), 0 12px 30px rgba(0,0,0,0.4); }
    100%{ box-shadow:0 0 14px rgba(25,167,255,0.4), 0 8px 20px rgba(0,0,0,0.4); }
}
.cta:hover{ animation-play-state:paused; transform:scale(1.07); }

.links{
    display:flex;
    gap:14px;
    margin-top:6px;
}
.links a{
    font-size:13px;
    color:var(--muted);
    text-decoration:none;
    padding:6px 14px;
    border:1px solid var(--line);
    border-radius:20px;
    transition:.25s;
}
.links a:hover{ color:var(--accent-bright); border-color:var(--accent); box-shadow:0 0 12px rgba(25,167,255,0.35); }

main{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    padding:20px;
    text-align:center;
}

.site-footer{
    position:fixed;
    bottom:0;
    width:100%;
    z-index:3;
    padding:1rem;
    color:var(--muted);
    font-size:0.85rem;
    text-align:center;
}

@media (max-width:600px){
    .b1{width:300px;height:300px;left:-20%;}
    .b2{width:250px;height:250px;right:-15%;}
    .b3{width:200px;height:200px;left:10%;}
    h1{font-size:42px;}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
</div>


<main>
    <div class="brand">
        <img src="ROASOD.png" alt="ROASOD logo">
    </div>

    <div>
        <h3>Welcome to my portfolio</h3>
        <h1 id="site-title">Tshabalala Raycee</h1>
        <h2> AceCoder </h2>
    </div>

    <a class="cta" href="portfolio.html" title="View the full portfolio">Discover</a>

    <nav class="links">
        <a href="https://roasod.vercel.app">My website</a>
        <a href="socials.html">Socials</a>
        <a href="Https://roasodgames.vercel.app">My games</a>
    </nav>
</main>

<footer class="site-footer" href="https://roasod.vercel.app" >
    <a>
        &copy; 2026 ROASOD-Websites.</a>
</footer>

</body>
</html>
