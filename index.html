<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="ue0xRqYcynyMUgZA3czX-Hy7lXg1K0AR3S3NpoetTFk" />
    <title>ROASOD | Tshabalala Raycee</title>
    <link rel="icon" href="ROASOD.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --ink: #0B0E13;
            --accent: #61dafb;
            --accent-2: #3c95e8;
            --text: rgba(255,255,255,0.95);
            --muted: rgba(255,255,255,0.75);
        
        }

        body,html{
            margin: 0;
            height: 100vh;
            background: var(--ink);
            display:flex;
            flex-direction:column;
            justify-content: center;
            align-items:center;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .logo {
            width:84px;
            height: 84px;
            font-size: 15px;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-weight:700;
            border-radius: 22px;
            background: linear-gradient(150deg, var(--accent), var(--accent-2));
            color: #060f1a;
            box-shadow: 0 15px 40px rgba(60, 120, 232, 0.28);
        }

        .blob{
            position:absolute;
            border-radius:50%;
            filter: blur(100px);
            opacity:0.5;
            mix-blend-mode: screen;
            transform: translate3d(0,0,0);
            will-change: transform;
            animation: float 22s ease-in-out infinite;
            pointer-events: none;
        }
        .b1{
            width:520px;height:520px;
            left:-10%;
            top:10%;
            background: radial-gradient(circle, var(--accent-2), transparent 70%);
        }
        .b2{
            width:420px;height:420px;
            right:-8%;
            top:30%;
            background: radial-gradient(circle, #0d162a, transparent 70%);
            animation-delay: 3s;
        }
        @keyframes float{
            0%{ transform: translateY(0) translateX(0) scale(1); }
            50%{ transform: translateY(-30px) translateX(20px) scale(1.03); }
            100%{ transform: translateY(0) translateX(0) scale(1); }
        }

        h1{
            margin:0;
            font-size: clamp(38px, 6.5vw, 64px);
            letter-spacing: -0.01em;
            font-weight:700;
            font-family: 'Space Grotesk', sans-serif;
            color:var(--text);
        }
        h3{
            margin:0;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 500;
            font-size: 12px;
            color: var(--muted);
        }

        .cta{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            margin-top:26px;
            padding:13px 30px;
            border-radius:12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color:#06061a;
            text-decoration:none;
            font-family: 'Inter', sans-serif;
            font-weight:700;
            letter-spacing: 0.02em;
            font-size: 14.5px;
            box-shadow: 0 12px 28px rgba(86, 60, 232, 0.28);
            transition: transform .25s ease, box-shadow .25s ease;
        }

        .cta:hover{
            transform: translateY(-3px);
            box-shadow: 0 16px 36px rgba(60, 77, 232, 0.4);
        }
        .cta:active{
            transform: translateY(-1px);
        }

        main {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            padding: 20px;
            text-align: center;
        }

        .site-footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 3;
            padding: 1rem;
            color: var(--muted);
            font-size: 0.9rem;
            text-align: center;
        }

        @media (max-width: 600px) {
            .b1 { width: 300px; height: 300px; left: -20%; }
            .b2 { width: 250px; height: 250px; right: -15%; }
            h1 { font-size: 40px; }
        }
    </style>
</head>
<body>

    <div class="blob b1" aria-hidden="true"></div>
    <div class="blob b2" aria-hidden="true"></div>

    <main>
        <div class="logo">ROASOD</div>

        <div>
            <h3>Welcome to my Portfolio</h3>
            <h1 id="site-title">Tshabalala Raycee</h1>
        </div>

        <a class="cta" href="portfolio.html" title="Learn more about ROASOD">Discover</a>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 ROASOD-Websites.</p>
    </footer>
</body>
</html>
